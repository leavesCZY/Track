[versions]
android-plugin = "8.9.0"
kotlin-plugin = "2.1.10"
gradle-plugin-publish-plugin = "1.3.1"

androidx-junit = "1.2.1"
androidx-espresso = "3.6.1"
androidx-appcompat = "1.7.0"
androidx-activity-compose = "1.10.1"
androidx-compose-bom = "2025.04.00"

junit-junit = "4.13.2"

google-material = "1.12.0"

ow2-asm-commons = "9.7.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "android-plugin" }

jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-plugin" }
jetbrains-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-plugin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-plugin" }

gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish-plugin" }

leavesczy-track = { id = "io.github.leavesczy.track" }

[libraries]
junit-junit = { module = "junit:junit", version.ref = "junit-junit" }

android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-plugin" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "android-plugin" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

google-material = { module = "com.google.android.material:material", version.ref = "google-material" }

ow2-asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "ow2-asm-commons" }